[package]
name = "spotidesk"
version = "0.2.0"
description = "SpotiDesk — Cliente de escritorio ultraligero de Spotify para macOS y Windows"
authors = ["SpotiDesk"]
edition = "2024"

[lib]
name = "spotidesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen", "NSResponder", "NSView", "NSColor"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSArray", "NSString", "NSValue", "NSDictionary"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
